[project]
name = "kicad-suite"
version = "0.2.0"
description = "AI-assisted KiCad hardware development pipeline"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "KiCad Suite contributors" }
]

[build-system]
requires = []
build-backend = "none"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "BLE"]
ignore = ["BLE001"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_ignores = true
